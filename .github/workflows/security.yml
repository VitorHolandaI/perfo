name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo-audit (RustSec advisories)
        run: |
          # taiki-e/install-action instala em ~/.install-action/bin; o act
          # runner do Gitea nao propaga o PATH do action pro run step.
          export PATH="$HOME/.install-action/bin:$PATH"
          cargo audit
      - name: cargo-deny (licencas, bans, advisories)
        run: |
          export PATH="$HOME/.install-action/bin:$PATH"
          cargo deny check