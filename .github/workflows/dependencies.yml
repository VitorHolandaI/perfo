name: Dependencies and Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  cargo-security:
    name: Cargo inventory and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Dependency inventory
        shell: bash
        run: |
          {
            echo "## Direct dependency tree"
            echo '```text'
            cargo tree --locked --depth 1
            echo '```'
            echo "## Duplicate dependency versions"
            echo '```text'
            cargo tree --locked --duplicates
            echo '```'
            echo "## Resolved package count"
            cargo metadata --format-version 1 --locked | jq '.packages | length'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Rust security tools
        run: cargo install cargo-audit cargo-deny --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        run: cargo deny check

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
