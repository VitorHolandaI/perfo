name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86-64:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: 1.98.0

      - name: Validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cargo_version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[0].version')
          manifest_version=$(jq -r '.version' manifest.json)
          test "$version" = "$cargo_version"
          test "$version" = "$manifest_version"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          tar --create --gzip --file perfo-linux-x86_64.tar.gz --directory target/release perfo
          sha256sum perfo-linux-x86_64.tar.gz > perfo-linux-x86_64.sha256

      - name: Publish release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            perfo-linux-x86_64.tar.gz
            perfo-linux-x86_64.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: linux-x86-64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/perfo-linux-x86_64.tar.gz \
              dist/perfo-linux-x86_64.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/perfo-linux-x86_64.tar.gz \
              dist/perfo-linux-x86_64.sha256 \
              --verify-tag \
              --title "Perfo $GITHUB_REF_NAME" \
              --generate-notes
          fi
